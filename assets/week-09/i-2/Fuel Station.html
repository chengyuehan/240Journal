<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FUEL/STAT — Inference Refueling Station</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&family=Major+Mono+Display&display=swap"
  rel="stylesheet"
/>

<style>
/* ============================================================
   FUEL STATION — industrial visualization for AI API pricing
   Aesthetic: warm-black panels, amber LCD glow, thermal paper.
   No branded UI — every provider treatment is original.
   ============================================================ */

:root {
  --bg:           #0a0908;
  --bg-2:         #0f0d0a;
  --panel:        #14110d;
  --panel-2:      #1b1712;
  --panel-3:      #251e16;
  --rule:         #2a241d;
  --rule-2:       #3a3127;
  --ink:          #c9bba6;
  --ink-bright:   #f1e6cf;
  --ink-dim:      #6e6457;
  --ink-faint:    #463f37;

  --amber:        #ff9e3d;
  --amber-hot:    #ffbf7a;
  --amber-glow:   #ff9e3d33;
  --red:          #d2452a;
  --red-glow:     #d2452a44;
  --green-led:    #6ee089;
  --caution:      #e3b341;

  --paper:        #ece2cf;
  --paper-edge:   #d4c8b1;
  --paper-ink:    #1a1612;

  --rad: 2px;
  --shadow-deep: 0 30px 80px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.02) inset;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 14px;
  letter-spacing: .01em;
  min-height: 100vh;
  overflow-x: hidden;
}

/* subtle film over everything — concrete floor / asphalt grain */
body::before {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 120%, rgba(255,158,61,.06), transparent 55%),
    radial-gradient(ellipse at 50% -20%, rgba(255,255,255,.025), transparent 50%);
  z-index: 1;
}
body::after {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  mix-blend-mode: multiply;
  opacity: .35;
  z-index: 2;
}

.mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
.display { font-family: 'Major Mono Display', 'JetBrains Mono', monospace; letter-spacing: .04em; }
.headline { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 700; letter-spacing: .02em; }
.upper { text-transform: uppercase; }

/* ---------------- top chrome / station bar ---------------- */

.station-shell {
  position: relative;
  z-index: 3;
  display: grid;
  grid-template-rows: 56px 1fr 44px;
  height: 100vh;
  min-height: 760px;
  min-width: 1340px;
}
html, body { overflow: auto; }
body { min-width: 1340px; min-height: 760px; }

.topbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 24px;
  padding: 0 22px;
  background: linear-gradient(180deg, #100d09, #0a0908);
  border-bottom: 1px solid var(--rule);
  position: relative;
}
.topbar::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -3px; height: 2px;
  background: repeating-linear-gradient(90deg, var(--amber) 0 8px, transparent 8px 16px);
  opacity: .35;
}
.topbar-left, .topbar-right {
  display: flex; align-items: center; gap: 14px;
  font-size: 11px; color: var(--ink-dim);
  text-transform: uppercase; letter-spacing: .18em;
}
.topbar-right { justify-content: flex-end; }

.brand {
  display: flex; align-items: center; gap: 12px;
}
.brand-mark {
  width: 30px; height: 30px;
  border: 1px solid var(--amber);
  position: relative;
  display: grid; place-items: center;
}
.brand-mark::before, .brand-mark::after {
  content: "";
  position: absolute; background: var(--amber);
}
.brand-mark::before { width: 14px; height: 2px; top: 50%; left: 50%; transform: translate(-50%,-50%); box-shadow: 0 0 8px var(--amber-glow); }
.brand-mark::after  { width: 2px; height: 14px; top: 50%; left: 50%; transform: translate(-50%,-50%); box-shadow: 0 0 8px var(--amber-glow); }
.brand-name {
  font-family: 'Major Mono Display', monospace;
  font-size: 14px; letter-spacing: .14em; color: var(--ink-bright);
}
.brand-sub {
  font-size: 9.5px; color: var(--ink-dim); letter-spacing: .3em;
}

.serial { font-size: 10.5px; letter-spacing: .22em; color: var(--ink-dim); }
.dot-led {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green-led); box-shadow: 0 0 8px var(--green-led);
  animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }

.view-toggle {
  display: inline-flex;
  border: 1px solid var(--rule-2);
  background: var(--panel);
}
.view-toggle button {
  appearance: none; background: transparent; border: 0;
  color: var(--ink-dim);
  padding: 8px 18px;
  font: 600 11px/1 'IBM Plex Sans', sans-serif;
  letter-spacing: .22em; text-transform: uppercase;
  cursor: pointer;
  border-right: 1px solid var(--rule);
}
.view-toggle button:last-child { border-right: 0; }
.view-toggle button.active {
  color: var(--bg);
  background: var(--amber);
  text-shadow: 0 0 0 var(--bg);
}
.view-toggle button:hover:not(.active) { color: var(--ink-bright); background: var(--panel-2); }

/* ---------------- footer ---------------- */

.footer {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 24px;
  padding: 0 22px;
  background: linear-gradient(0deg, #0c0a08, #100d09);
  border-top: 1px solid var(--rule);
  font: 500 10px/1 'JetBrains Mono', monospace;
  letter-spacing: .22em;
  color: var(--ink-dim);
  text-transform: uppercase;
}
.footer .center { text-align: center; }
.footer .right  { text-align: right; }
.footer-data { color: var(--ink); }
.footer-data b { color: var(--amber); font-weight: 700; }

/* ---------------- bay scene ---------------- */

.bay {
  position: relative;
  display: grid;
  grid-template-columns: 360px 1fr 380px;
  gap: 0;
  min-height: 0;
  overflow: hidden;
}

/* concrete floor that bleeds across the middle column */
.bay::before {
  content: "";
  position: absolute;
  left: 360px; right: 380px; bottom: 0; height: 38%;
  background:
    linear-gradient(180deg, transparent, rgba(0,0,0,.55) 70%, rgba(0,0,0,.85)),
    repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 80px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 80px),
    linear-gradient(180deg, #1a1610, #0b0a08);
  pointer-events: none;
  z-index: 0;
}
/* faint hazard markings along the bay floor */
.bay::after {
  content: "";
  position: absolute;
  left: 360px; right: 380px; bottom: 18px; height: 14px;
  background: repeating-linear-gradient(45deg,
    rgba(255,158,61,.45) 0 14px,
    rgba(0,0,0,0) 14px 28px);
  opacity: .25;
  pointer-events: none;
  z-index: 0;
}

/* ---------------- left rail: pump selector ---------------- */

.rail {
  position: relative;
  z-index: 1;
  background: linear-gradient(180deg, #100d09, #0c0a08 80%);
  border-right: 1px solid var(--rule);
  display: flex; flex-direction: column;
  min-height: 0;
}

.rail-section { padding: 16px 18px; border-bottom: 1px solid var(--rule); }
.rail-section.flex { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

.section-label {
  display: flex; align-items: center; justify-content: space-between;
  font: 500 9.5px/1 'JetBrains Mono', monospace;
  letter-spacing: .3em; color: var(--ink-dim); text-transform: uppercase;
  margin-bottom: 12px;
}
.section-label .tag {
  background: var(--amber); color: var(--bg);
  padding: 2px 6px; font-weight: 700; letter-spacing: .18em;
}

.provider-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
}
.provider-chip {
  appearance: none; background: var(--panel); border: 1px solid var(--rule);
  color: var(--ink); padding: 10px 10px;
  text-align: left; cursor: pointer;
  position: relative;
  transition: border-color .12s, background .12s;
}
.provider-chip:hover { border-color: var(--rule-2); background: var(--panel-2); }
.provider-chip.active {
  background: var(--panel-3);
  border-color: var(--amber);
  box-shadow: inset 0 0 0 1px var(--amber-glow);
}
.provider-chip .code {
  font: 700 10px/1 'JetBrains Mono', monospace;
  letter-spacing: .22em; color: var(--ink-dim);
  display: block; margin-bottom: 6px;
}
.provider-chip .name {
  font: 700 11px/1.1 'IBM Plex Sans', sans-serif;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-bright);
}
.provider-chip .swatch {
  position: absolute; top: 8px; right: 8px;
  width: 10px; height: 10px; border-radius: 50%;
}

.model-list {
  flex: 1;
  overflow-y: auto;
  border: 1px solid var(--rule);
  background: var(--bg-2);
}
.model-list::-webkit-scrollbar { width: 8px; }
.model-list::-webkit-scrollbar-track { background: transparent; }
.model-list::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 4px; }

.model-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: baseline;
  padding: 9px 12px;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
  position: relative;
}
.model-row:last-child { border-bottom: 0; }
.model-row:hover { background: var(--panel); }
.model-row.active {
  background: linear-gradient(90deg, rgba(255,158,61,.10), transparent 60%);
  box-shadow: inset 3px 0 0 var(--amber);
}
.model-row .name {
  font: 600 12px/1.2 'IBM Plex Sans', sans-serif;
  color: var(--ink-bright);
}
.model-row .tier {
  font: 500 9px/1 'JetBrains Mono', monospace;
  letter-spacing: .22em; color: var(--ink-dim);
  margin-top: 3px;
  text-transform: uppercase;
}
.model-row .price {
  font: 700 13px/1 'JetBrains Mono', monospace;
  color: var(--amber);
  text-align: right;
}
.model-row .price small { display:block; font-weight: 400; font-size: 8.5px; color: var(--ink-dim); letter-spacing: .14em; margin-top: 4px; }

/* ---------------- center: pump + robot ---------------- */

.bay-center {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: 22px 28px 28px;
  min-height: 0;
  overflow: hidden;
}

.bay-header {
  display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: end; gap: 24px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 18px;
}
.bay-header .lh, .bay-header .rh {
  font: 500 10px/1.4 'JetBrains Mono', monospace;
  letter-spacing: .22em; color: var(--ink-dim);
  text-transform: uppercase;
}
.bay-header .rh { text-align: right; }
.bay-header h1 {
  margin: 0;
  font: 400 28px/1 'Major Mono Display', monospace;
  letter-spacing: .14em;
  color: var(--ink-bright);
  text-align: center;
  white-space: nowrap;
}
.bay-header .sub {
  margin-top: 6px;
  font: 500 10px/1 'JetBrains Mono', monospace;
  letter-spacing: .32em;
  color: var(--amber);
  text-align: center;
}

.stage {
  position: relative;
  display: grid;
  grid-template-columns: minmax(280px, 1fr) 320px minmax(320px, 1.2fr);
  gap: 24px;
  align-items: stretch;
  min-height: 0;
}

/* ---------- pump column ---------- */

.pump {
  position: relative;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--rule-2);
  border-radius: var(--rad);
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  box-shadow: var(--shadow-deep);
  overflow: hidden;
}
.pump::before {
  content: "";
  position: absolute; inset: 6px;
  border: 1px solid var(--rule);
  pointer-events: none;
}

.pump-cap {
  display: grid; grid-template-columns: 1fr auto;
  align-items: center;
  padding: 10px 14px;
  background: var(--panel-3);
  border-bottom: 1px solid var(--rule-2);
  position: relative;
}
.pump-cap .pump-no {
  font: 700 10px/1 'JetBrains Mono', monospace;
  letter-spacing: .3em;
  color: var(--ink-dim);
}
.pump-cap .pump-name {
  font: 700 16px/1 'IBM Plex Sans', sans-serif;
  letter-spacing: .06em;
  color: var(--ink-bright);
  margin-top: 4px;
  text-transform: uppercase;
}
.pump-cap .pump-stripe {
  width: 18px; height: 32px;
  background: var(--prov-stripe, var(--amber));
  position: relative;
}
.pump-cap .pump-stripe::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 2px, transparent 2px 5px);
}

.lcd {
  margin: 12px;
  padding: 14px 16px;
  background: #0a0b0a;
  border: 1px solid #000;
  box-shadow: inset 0 0 24px rgba(0,0,0,.85), inset 0 0 0 1px #1a1d1a;
  position: relative;
  font-family: 'JetBrains Mono', monospace;
  color: var(--prov-lcd, var(--amber));
  text-shadow: 0 0 10px currentColor;
}
.lcd::before {
  content: "";
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.30) 0 1px, transparent 1px 3px);
  pointer-events: none;
}
.lcd .lcd-row {
  display: grid; grid-template-columns: 90px 1fr;
  gap: 8px; align-items: baseline;
  margin-bottom: 4px;
  font-size: 11px;
  letter-spacing: .14em;
}
.lcd .lcd-row .k { opacity: .55; }
.lcd .lcd-row .v { font-weight: 700; }
.lcd .lcd-row.big .v { font-size: 28px; line-height: 1; letter-spacing: .04em; }
.lcd .lcd-row.big { grid-template-columns: 90px 1fr; margin: 8px 0 4px; }
.lcd .lcd-row.huge .v { font-size: 38px; line-height: 1; letter-spacing: .02em; }
.lcd .lcd-row.huge { grid-template-columns: 90px 1fr; }

.gauges {
  padding: 0 12px 12px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.gauge {
  background: var(--bg);
  border: 1px solid var(--rule);
  padding: 10px;
  display: grid;
  grid-template-rows: auto 1fr auto;
}
.gauge .lab {
  font: 500 9px/1 'JetBrains Mono', monospace;
  letter-spacing: .26em; color: var(--ink-dim);
  text-transform: uppercase;
}
.gauge canvas { display: block; width: 100%; height: 90px; margin: 6px 0 0; }
.gauge .val {
  font: 700 12px/1 'JetBrains Mono', monospace;
  color: var(--ink-bright);
  letter-spacing: .08em;
  text-align: right;
}

.pump-base {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0;
  border-top: 1px solid var(--rule-2);
  background: var(--panel-3);
}
.pump-base .nozzle-slot, .pump-base .grade-slot {
  padding: 10px 14px;
  border-right: 1px solid var(--rule-2);
}
.pump-base .grade-slot { border-right: 0; }
.pump-base .micro {
  font: 500 9px/1 'JetBrains Mono', monospace;
  letter-spacing: .26em; color: var(--ink-dim);
  text-transform: uppercase;
}
.pump-base .val-mono {
  font: 700 12px/1 'JetBrains Mono', monospace;
  color: var(--ink-bright);
  margin-top: 6px;
  letter-spacing: .06em;
}

/* nozzle hose to the robot */
.hose {
  position: absolute;
  z-index: 2;
  top: 56%;
  right: -56px;
  width: 90px;
  height: 110px;
  pointer-events: none;
}

/* ---------- robot column ---------- */

.robot-bay {
  position: relative;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 24px;
}
.robot {
  position: relative;
  width: 280px; height: 360px;
  filter: drop-shadow(0 12px 0 rgba(0,0,0,.4));
}
.robot canvas { display: block; }

.robot-plate {
  position: absolute;
  left: 50%; transform: translateX(-50%);
  bottom: -10px;
  font: 500 10px/1 'JetBrains Mono', monospace;
  letter-spacing: .28em;
  color: var(--ink-dim);
  background: var(--panel-3);
  border: 1px solid var(--rule);
  padding: 6px 12px;
  text-transform: uppercase;
}

.bay-lights {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px;
}
.bay-lights .lt {
  width: 10px; height: 10px; border-radius: 50%;
  background: #20180f;
  border: 1px solid #2a1f14;
}
.bay-lights .lt.on.green { background: var(--green-led); box-shadow: 0 0 10px var(--green-led); }
.bay-lights .lt.on.amber { background: var(--amber);   box-shadow: 0 0 10px var(--amber-glow); }
.bay-lights .lt.on.red   { background: var(--red);     box-shadow: 0 0 10px var(--red-glow); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* ---------- task column ---------- */

.task-col {
  display: flex; flex-direction: column; gap: 14px;
  min-height: 0;
}
.task-header {
  display: flex; align-items: center; justify-content: space-between;
}
.task-header .h {
  font: 700 14px/1 'IBM Plex Sans', sans-serif;
  letter-spacing: .04em;
  color: var(--ink-bright);
  text-transform: uppercase;
}
.task-header .meta {
  font: 500 10px/1 'JetBrains Mono', monospace;
  letter-spacing: .22em; color: var(--ink-dim);
  text-transform: uppercase;
}

.task-list {
  display: grid;
  gap: 8px;
  overflow-y: auto;
  padding-right: 4px;
}
.task-list::-webkit-scrollbar { width: 6px; }
.task-list::-webkit-scrollbar-thumb { background: var(--rule-2); }

.task-card {
  display: grid;
  grid-template-columns: 60px 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 12px;
  background: var(--panel);
  border: 1px solid var(--rule);
  cursor: pointer;
  position: relative;
}
.task-card:hover { background: var(--panel-2); border-color: var(--rule-2); }
.task-card.active {
  background: var(--panel-2);
  border-color: var(--amber);
  box-shadow: inset 3px 0 0 var(--amber);
}
.task-shape {
  width: 56px; height: 56px;
  background: var(--bg);
  border: 1px solid var(--rule-2);
  position: relative;
  display: grid; place-items: center;
}
.task-card .lab {
  font: 700 12px/1.2 'IBM Plex Sans', sans-serif;
  color: var(--ink-bright);
  text-transform: uppercase;
  letter-spacing: .04em;
}
.task-card .sub {
  margin-top: 3px;
  font: 500 10px/1.2 'JetBrains Mono', monospace;
  color: var(--ink-dim);
  letter-spacing: .04em;
}
.task-card .tk {
  font: 700 13px/1 'JetBrains Mono', monospace;
  color: var(--amber);
  text-align: right;
}
.task-card .tk small {
  display: block;
  font-weight: 400; font-size: 8.5px;
  color: var(--ink-dim); letter-spacing: .18em;
  margin-top: 4px;
}

/* ---------- bottom command bar ---------- */

.command-bar {
  margin-top: 18px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 18px;
  align-items: stretch;
  padding: 14px 18px;
  background: linear-gradient(180deg, #100d09, #0c0a08);
  border: 1px solid var(--rule);
}
.command-meta {
  display: flex; flex-direction: column; gap: 4px;
  font: 500 10px/1.2 'JetBrains Mono', monospace;
  letter-spacing: .2em; color: var(--ink-dim);
  text-transform: uppercase;
}
.command-meta b { color: var(--ink-bright); font-weight: 700; }
.command-meta .row { display: flex; gap: 18px; }

.big-btn {
  appearance: none; cursor: pointer;
  background: linear-gradient(180deg, var(--amber-hot), var(--amber));
  color: #1a0f02;
  border: 0; border-bottom: 3px solid #b56a17;
  padding: 0 36px;
  font: 800 16px/1 'IBM Plex Sans', sans-serif;
  letter-spacing: .26em; text-transform: uppercase;
  min-width: 280px;
  position: relative;
  transition: transform .06s ease;
}
.big-btn:active { transform: translateY(1px); border-bottom-width: 2px; }
.big-btn:hover { filter: brightness(1.06); }
.big-btn:disabled { background: #2a241d; color: var(--ink-faint); border-bottom-color: #1a1612; cursor: not-allowed; }

.big-btn .arrow {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  font-size: 18px;
}

.kill-btn {
  appearance: none; cursor: pointer;
  background: linear-gradient(180deg, #1a1612, #0e0c0a);
  color: var(--red);
  border: 1px solid var(--red);
  padding: 14px 22px;
  font: 800 14px/1 'IBM Plex Sans', sans-serif;
  letter-spacing: .22em;
  text-transform: uppercase;
}
.kill-btn:hover { background: var(--red); color: #ffeae3; }

.command-status {
  text-align: right;
  font: 500 10px/1.3 'JetBrains Mono', monospace;
  letter-spacing: .22em; color: var(--ink-dim);
  text-transform: uppercase;
}
.command-status .big {
  font: 700 22px/1 'Major Mono Display', monospace;
  color: var(--amber);
  letter-spacing: .12em;
  margin-bottom: 4px;
}

/* ---------------- right rail: receipt printer ---------------- */

.printer {
  position: relative;
  z-index: 1;

}

  height: 6px;

  border-top: 1px solid #000;
}
.printer-head .slot::before {
  content: ""; position: absolute; left: 6px; right: 6px; top: 1px; height: 1px;
  background: repeating-linear-gradient(90deg, var(--rule-2) 0 4px, transparent 4px 8px);
}
.printer-feed {
  position: relative;
  overflow: hidden;
  padding: 28px 18px 26px;
}

/* the visible printed receipt */
.receipt {
  background: var(--paper);
  color: var(--paper-ink);
  position: relative;
  margin: 0 auto;
  width: 100%;
  max-width: 320px;
  padding: 22px 18px 18px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  line-height: 1.45;
  letter-spacing: .04em;
  box-shadow: 0 24px 36px rgba(0,0,0,.55), 0 2px 0 rgba(0,0,0,.3);
}
.receipt::before, .receipt::after {
  content: "";
  position: absolute; left: 0; right: 0; height: 10px;
  background:
    radial-gradient(circle at 6px 50%, var(--bg) 4px, transparent 4.5px),
    linear-gradient(0deg, transparent, transparent);
  background-repeat: repeat-x;
  background-size: 12px 100%;
}
.receipt::before { top: -1px; transform: scaleY(-1); }
.receipt::after  { bottom: -1px; }
/* zigzag bottom tear */
.receipt.tear-bottom { padding-bottom: 26px; }
.receipt.tear-bottom::after {
  height: 8px; bottom: -7px;
  background:
    linear-gradient(135deg, var(--paper) 50%, transparent 50%) 0 0/14px 14px,
    linear-gradient(45deg,  var(--paper) 50%, transparent 50%) 7px 0/14px 14px;
}

.receipt .rcp-mark {
  text-align: center;
  font-weight: 700;
  letter-spacing: .26em;
  font-size: 14px;
  margin-bottom: 2px;
  text-transform: uppercase;
}
.receipt .rcp-sub {
  text-align: center;
  font-size: 9px; letter-spacing: .3em;
  margin-bottom: 12px;
  text-transform: uppercase;
  opacity: .7;
}
.receipt .rcp-stripe {
  height: 6px;
  margin: 8px -18px 12px;
  background: var(--prov-stripe, #333);
  position: relative;
}
.receipt .rcp-rule {
  border-top: 1px dashed var(--paper-ink);
  margin: 10px 0;
  opacity: .55;
}
.receipt .rcp-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  margin: 2px 0;
}
.receipt .rcp-row .k { opacity: .75; }
.receipt .rcp-row.big {
  font-size: 14px; font-weight: 700;
  letter-spacing: .06em;
  margin: 8px 0 6px;
}
.receipt .rcp-row.bigger {
  font-size: 22px; font-weight: 700;
  letter-spacing: .04em;
  margin: 6px 0;
  border-top: 2px solid var(--paper-ink);
  border-bottom: 2px double var(--paper-ink);
  padding: 6px 0;
}
.receipt .rcp-foot {
  margin-top: 12px;
  font-size: 9px;
  letter-spacing: .18em;
  text-align: center;
  text-transform: uppercase;
  opacity: .7;
}
.receipt .rcp-barcode {
  height: 28px;
  margin-top: 8px;
  background-image: repeating-linear-gradient(90deg,
    var(--paper-ink) 0 2px, transparent 2px 4px,
    var(--paper-ink) 4px 5px, transparent 5px 9px,
    var(--paper-ink) 9px 12px, transparent 12px 14px);
}
.receipt .rcp-barnum {
  text-align: center;
  letter-spacing: .26em;
  font-size: 9px;
  margin-top: 4px;
}
.receipt .rcp-noise {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.04) 0 1px, transparent 1px 2px);
  mix-blend-mode: multiply;
}
.receipt .rcp-grit::after {
  content: "";
  position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(rgba(0,0,0,.04) 1px, transparent 1px);
  background-size: 3px 3px;
  mix-blend-mode: multiply;
}

/* provider motifs on receipts */
.receipt[data-motif="stencil"] .rcp-mark   { font-family: 'Major Mono Display', monospace; font-weight: 400; letter-spacing: .3em; }
.receipt[data-motif="geodesic"] .rcp-mark  { font-family: 'IBM Plex Sans', sans-serif; }
.receipt[data-motif="grid"]                { background-image: linear-gradient(rgba(0,0,0,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.04) 1px, transparent 1px); background-size: 14px 14px; }
.receipt[data-motif="diagonal"]            { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.045) 0 1px, transparent 1px 8px); }
.receipt[data-motif="halftone"]            { background-image: radial-gradient(rgba(0,0,0,.10) 1px, transparent 1.5px); background-size: 6px 6px; }
.receipt[data-motif="tide"]                { background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 6px); }
.receipt[data-motif="lattice"]             { background-image: repeating-linear-gradient(60deg, rgba(0,0,0,.05) 0 1px, transparent 1px 10px), repeating-linear-gradient(120deg, rgba(0,0,0,.05) 0 1px, transparent 1px 10px); }
.receipt[data-motif="stripe"]              { background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 20px); }
.receipt[data-motif="minimal"]             { /* nothing */ }

.printer-feed.printing .receipt {
  animation: feed 0.25s linear infinite;
}
@keyframes feed {
  0% { transform: translateY(0); }
  100% { transform: translateY(4px); }
}

.printer-actions {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0;

}
.printer-actions button {

  letter-spacing: .22em; text-transform: uppercase;
  cursor: pointer;
  border-right: 1px solid var(--rule);
}
.printer-actions button:last-child { border-right: 0; }
.printer-actions button:hover { background: var(--panel); color: var(--amber); }

.printer-empty {

.wall {

  letter-spacing: .26em;
  padding: 3px 8px;
  z-index: 5;
}
.wall-cell.priciest::before {
  content: "PRICIEST";
  position: absolute;
  top: -22px; left: 50%; transform: translateX(-50%);

  font: 800 9px/1 'JetBrains Mono', monospace;
  letter-spacing: .26em;
  padding: 3px 8px;
  z-index: 5;
}

.wall-cell .pin {
  position: absolute;
  top: -10px; left: 50%; transform: translateX(-50%);

  z-index: 10;
}
.wall-cell .receipt {
  cursor: pointer;
}
.wall-cell:nth-child(3n) .receipt { transform: rotate(-1.2deg); }
.wall-cell:nth-child(3n+1) .receipt { transform: rotate(0.8deg); }
.wall-cell:nth-child(3n+2) .receipt { transform: rotate(-0.4deg); }
.wall-cell .receipt:hover { transform: rotate(0) scale(1.02); transition: transform .15s; z-index: 4; box-shadow: 0 30px 50px rgba(0,0,0,.6); }

.wall-cell .unpin {
  position: absolute; top: -6px; right: -6px;

  background: var(--panel-2); color: var(--ink-dim);
  border: 1px solid var(--rule-2);
  font: 700 11px/1 'JetBrains Mono', monospace;
  cursor: pointer;
  opacity: 0;
  transition: opacity .15s;
  z-index: 11;
}
.wall-cell:hover .unpin { opacity: 1; }
.wall-cell .unpin:hover { color: var(--red); border-color: var(--red); }

.wall-empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 20px;
  color: var(--ink-faint);
  font: 500 12px/1.6 'JetBrains Mono', monospace;
  letter-spacing: .24em;
  text-transform: uppercase;
}

.api-pill.fallback .led { background: var(--caution); box-shadow: 0 0 6px var(--caution); }

/* shake on fueling */
@keyframes shake {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(-0.5px, 0.3px); }
  40% { transform: translate(0.5px, -0.4px); }
  60% { transform: translate(-0.3px, 0.5px); }
  80% { transform: translate(0.4px, 0.2px); }
}
.fueling .pump { animation: shake 0.25s linear infinite; }

.bay-strobe {

/* tweaks panel adjustments */
.tweaks-overrides .twk-section-head { color: var(--ink-bright) !important; }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  </script>

  <script type="text/babel" data-presets="env,react">
/* global React, ReactDOM, FUEL_FALLBACK, FUEL_TASKS, PROVIDER_STYLE, FUEL_FETCH_LIVE, TweaksPanel, useTweaks, TweakSection, TweakSlider, TweakToggle, TweakRadio, TweakSelect */

const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* =========================================================
   AUDIO — procedural, opt-in. Soft industrial hum + clicks.
   ========================================================= */

const Audio = (() => {
  let ctx, master, humOsc, humGain, noiseSource, noiseGain;
  let enabled = false;
  let started = false;

  function ensure() {
    if (started) return;
    started = true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.0;
    master.connect(ctx.destination);

    // hum
    humOsc = ctx.createOscillator();
    humOsc.type = "sawtooth";
    humOsc.frequency.value = 56;
    humGain = ctx.createGain();
    humGain.gain.value = 0;
    const humFilt = ctx.createBiquadFilter();
    humFilt.type = "lowpass"; humFilt.frequency.value = 120;
    humOsc.connect(humFilt).connect(humGain).connect(master);
    humOsc.start();

    // noise (paper feed / hiss)
    const buf = ctx.createBuffer(1, ctx.sampleRate * 1.5, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.4;
    noiseSource = ctx.createBufferSource();
    noiseSource.buffer = buf; noiseSource.loop = true;
    const noiseFilt = ctx.createBiquadFilter();
    noiseFilt.type = "bandpass"; noiseFilt.frequency.value = 1800; noiseFilt.Q.value = 0.8;
    noiseGain = ctx.createGain(); noiseGain.gain.value = 0;
    noiseSource.connect(noiseFilt).connect(noiseGain).connect(master);
    noiseSource.start();
  }

  function setEnabled(on) {
    enabled = on;
    ensure();
    if (!ctx) return;
    if (on && ctx.state === "suspended") ctx.resume();
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.linearRampToValueAtTime(on ? 0.6 : 0.0, ctx.currentTime + 0.2);
  }

  function setFlow(amount) {
    // amount: 0..1
    if (!enabled || !ctx) return;
    humGain.gain.cancelScheduledValues(ctx.currentTime);
    humGain.gain.linearRampToValueAtTime(0.05 + amount * 0.18, ctx.currentTime + 0.1);
    noiseGain.gain.cancelScheduledValues(ctx.currentTime);
    noiseGain.gain.linearRampToValueAtTime(amount * 0.06, ctx.currentTime + 0.1);
    if (humOsc) {
      humOsc.frequency.cancelScheduledValues(ctx.currentTime);
      humOsc.frequency.linearRampToValueAtTime(46 + amount * 28, ctx.currentTime + 0.1);
    }
  }

  function click(freq = 1400, dur = 0.04, gainVal = 0.08) {
    if (!enabled || !ctx) return;
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(gainVal, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.connect(g).connect(master);
    o.start(); o.stop(ctx.currentTime + dur);
  }

  function beep(freq = 740, dur = 0.18, gainVal = 0.06) {
    if (!enabled || !ctx) return;
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(gainVal, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.connect(g).connect(master);
    o.start(); o.stop(ctx.currentTime + dur);
  }

  return { setEnabled, setFlow, click, beep };
})();

/* =========================================================
   ROBOT — abstract industrial unit drawn to canvas.
   No humanoid SVG art — just primitives that read as a
   machine with a fuel port.
   ========================================================= */

function Robot({ fueling, completePulse }) {
  const ref = useRef(null);
  const stateRef = useRef({ fueling, completePulse });
  useEffect(() => { stateRef.current = { fueling, completePulse }; }, [fueling, completePulse]);

  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const W = 280, H = 360;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);

    let stopped = false;
    let t0 = performance.now();
    const draw = () => {
      if (stopped) return;
      const now = performance.now();
      const { fueling, completePulse } = stateRef.current;
      const t = (now - t0) / 1000;
      ctx.clearRect(0, 0, W, H);

      // bob
      const bob = Math.sin(t * 1.4) * 1.5;
      ctx.save();
      ctx.translate(0, bob);

      // shadow plate
      ctx.fillStyle = "rgba(0,0,0,.45)";
      ctx.beginPath();
      ctx.ellipse(W / 2, H - 14, 78, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // base / pad
      ctx.fillStyle = "#1a1610";
      ctx.fillRect(W / 2 - 86, H - 36, 172, 22);
      ctx.strokeStyle = "#3a2f24"; ctx.lineWidth = 1;
      ctx.strokeRect(W / 2 - 86, H - 36, 172, 22);
      // pad chevrons
      ctx.fillStyle = "#ff9e3d33";
      for (let i = 0; i < 8; i++) {
        ctx.fillRect(W / 2 - 80 + i * 20, H - 32, 8, 14);
      }

      // legs
      ctx.fillStyle = "#2a241d";
      ctx.fillRect(W / 2 - 56, H - 86, 24, 52);
      ctx.fillRect(W / 2 + 32, H - 86, 24, 52);
      ctx.strokeStyle = "#3a2f24";
      ctx.strokeRect(W / 2 - 56, H - 86, 24, 52);
      ctx.strokeRect(W / 2 + 32, H - 86, 24, 52);
      // hydraulic detail
      ctx.fillStyle = "#0d0b08";
      ctx.fillRect(W / 2 - 50, H - 80, 12, 40);
      ctx.fillRect(W / 2 + 38, H - 80, 12, 40);

      // torso (chassis)
      ctx.fillStyle = "#2a241d";
      ctx.fillRect(W / 2 - 80, 96, 160, 132);
      ctx.fillStyle = "#1f1a14";
      ctx.fillRect(W / 2 - 76, 100, 152, 124);

      // torso plate seams
      ctx.strokeStyle = "#3a2f24"; ctx.lineWidth = 1;
      ctx.strokeRect(W / 2 - 80, 96, 160, 132);
      ctx.beginPath();
      ctx.moveTo(W / 2 - 80, 138); ctx.lineTo(W / 2 + 80, 138);
      ctx.moveTo(W / 2 - 80, 186); ctx.lineTo(W / 2 + 80, 186);
      ctx.moveTo(W / 2, 96); ctx.lineTo(W / 2, 228);
      ctx.stroke();

      // bolts
      ctx.fillStyle = "#3a2f24";
      for (const [x, y] of [[W/2-76, 100],[W/2+72, 100],[W/2-76, 220],[W/2+72, 220]]) {
        ctx.beginPath(); ctx.arc(x + 2, y + 4, 2, 0, Math.PI * 2); ctx.fill();
      }

      // serial / barcode plate
      ctx.fillStyle = "#0d0b08";
      ctx.fillRect(W / 2 - 70, 196, 50, 26);
      ctx.fillStyle = "#c9bba6";
      ctx.font = "700 8px 'JetBrains Mono', monospace";
      ctx.fillText("MDL-U/4407", W / 2 - 66, 207);
      ctx.fillStyle = "#6e6457";
      ctx.font = "400 7px 'JetBrains Mono', monospace";
      ctx.fillText("INFER UNIT", W / 2 - 66, 217);

      // chest display window
      ctx.fillStyle = "#050403";
      ctx.fillRect(W / 2 - 10, 150, 60, 30);
      // mini "spectrum"
      ctx.fillStyle = "#ff9e3d";
      ctx.shadowColor = "#ff9e3d"; ctx.shadowBlur = 6;
      for (let i = 0; i < 6; i++) {
        const h = 4 + (Math.sin(t * 4 + i) * 0.5 + 0.5) * 18 * (fueling ? 1 : 0.3);
        ctx.fillRect(W / 2 - 6 + i * 9, 176 - h, 5, h);
      }
      ctx.shadowBlur = 0;

      // FUEL PORT (highlighted)
      const portX = W / 2 - 80, portY = 154;
      ctx.fillStyle = "#0d0b08";
      ctx.fillRect(portX - 14, portY, 18, 26);
      // inner port hole
      const portPulse = fueling ? (Math.sin(t * 8) * 0.5 + 0.5) : (completePulse ? 0.8 : 0.2);
      ctx.fillStyle = `rgba(255,158,61,${0.4 + portPulse * 0.6})`;
      ctx.shadowColor = "#ff9e3d"; ctx.shadowBlur = fueling ? 14 : 4;
      ctx.fillRect(portX - 10, portY + 4, 10, 18);
      ctx.shadowBlur = 0;
      // port frame
      ctx.strokeStyle = "#3a2f24"; ctx.lineWidth = 1;
      ctx.strokeRect(portX - 14, portY, 18, 26);
      // port label
      ctx.fillStyle = "#6e6457";
      ctx.font = "700 7px 'JetBrains Mono', monospace";
      ctx.fillText("IN", portX - 14, portY - 4);

      // head / sensor cluster
      ctx.fillStyle = "#2a241d";
      ctx.fillRect(W / 2 - 56, 56, 112, 38);
      ctx.fillStyle = "#1f1a14";
      ctx.fillRect(W / 2 - 52, 60, 104, 30);
      // visor
      ctx.fillStyle = "#050403";
      ctx.fillRect(W / 2 - 44, 68, 88, 14);
      // single LED eye
      const eyeBright = fueling ? 0.9 + Math.sin(t * 6) * 0.1 : 0.55;
      ctx.fillStyle = `rgba(110,224,137,${eyeBright})`;
      ctx.shadowColor = "#6ee089"; ctx.shadowBlur = 8;
      ctx.fillRect(W / 2 - 5, 73, 10, 4);
      ctx.shadowBlur = 0;

      // antenna
      ctx.strokeStyle = "#3a2f24"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(W / 2 + 38, 56); ctx.lineTo(W / 2 + 38, 38);
      ctx.stroke();
      ctx.fillStyle = "#d2452a";
      ctx.beginPath(); ctx.arc(W / 2 + 38, 36, 3, 0, Math.PI * 2); ctx.fill();
      if (fueling) {
        ctx.fillStyle = "rgba(210,69,42,0.5)";
        ctx.shadowColor = "#d2452a"; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(W / 2 + 38, 36, 5 + Math.sin(t * 5) * 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }

      // arms
      ctx.fillStyle = "#2a241d";
      ctx.fillRect(W / 2 - 100, 110, 20, 80);
      ctx.fillRect(W / 2 + 80, 110, 20, 80);
      ctx.strokeStyle = "#3a2f24";
      ctx.strokeRect(W / 2 - 100, 110, 20, 80);
      ctx.strokeRect(W / 2 + 80, 110, 20, 80);
      ctx.fillStyle = "#0d0b08";
      ctx.fillRect(W / 2 - 96, 116, 12, 6);
      ctx.fillRect(W / 2 + 84, 116, 12, 6);

      ctx.restore();
    };
    draw();
    const iv = setInterval(draw, 1000 / 30);
    return () => { stopped = true; clearInterval(iv); };
  }, []);

  return <canvas ref={ref} />;
}

/* =========================================================
   GAUGE — small analog dial drawn to canvas.
   ========================================================= */

function Gauge({ value, max, label, unit, color = "#ff9e3d" }) {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);

    const cx = W / 2, cy = H + 10, r = Math.min(W * 0.45, H * 0.95);
    // arc background
    ctx.lineWidth = 6;
    ctx.strokeStyle = "#241e16";
    ctx.beginPath();
    ctx.arc(cx, cy, r, Math.PI, 0);
    ctx.stroke();

    // tick marks
    ctx.strokeStyle = "#3a2f24"; ctx.lineWidth = 1;
    for (let i = 0; i <= 10; i++) {
      const a = Math.PI + (i / 10) * Math.PI;
      const r0 = r - 10, r1 = r - 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.stroke();
    }

    // active arc
    const v = Math.max(0, Math.min(1, value / max));
    ctx.strokeStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = 8;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(cx, cy, r, Math.PI, Math.PI + v * Math.PI);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // needle
    const a = Math.PI + v * Math.PI;
    ctx.strokeStyle = "#c9bba6"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * (r - 14), cy + Math.sin(a) * (r - 14));
    ctx.stroke();
    // hub
    ctx.fillStyle = "#0a0908";
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#3a2f24"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.stroke();
  }, [value, max, color]);

  return (
    <div className="gauge">
      <div className="lab">{label}</div>
      <canvas ref={ref} />
      <div className="val">{value} <span style={{ color: "var(--ink-dim)" }}>{unit}</span></div>
    </div>
  );
}

/* =========================================================
   TASK SHAPE — abstract glyph for each task card.

function TaskShape({ shape, active }) {

  if (shape === "grid") return (

        <rect key={`${r}-${c}`} x={6 + c*8} y={6 + r*8} width="6" height="6" stroke={color} fill="none" />
      ))}

  if (shape === "wave") return (

      <path d="M4 18 Q9 8, 14 18 T 24 18 T 34 18" stroke={color} fill="none" />
      <path d="M4 24 Q9 14, 14 24 T 24 24 T 34 24" stroke={color} fill="none" opacity="0.5" />
    </svg>
  );
  if (shape === "dot") return (
    <svg width={sz} height={sz} viewBox="0 0 36 36">

        <circle key={`${x}-${y}`} cx={x} cy={y} r="2" fill={color} />
      ))}
    </svg>
  );
  if (shape === "burst") return (
    <svg width={sz} height={sz} viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="3" fill={color} />

      })}

  if (shape === "bar") return (

      {!compact && (

          <div className="rcp-row"><span className="k">SESSION</span><span>{rcpt.sessionId}</span></div>
          <div className="rcp-row"><span className="k">TIMESTAMP</span><span>{rcpt.time}</span></div>
          <div className="rcp-row"><span className="k">PUMP NO.</span><span>{rcpt.pumpNo}</span></div>
        </>
      )}

      <div className="rcp-barcode" />
      <div className="rcp-barnum">{rcpt.sessionId} · {rcpt.providerId.toUpperCase()}-{rcpt.modelId.slice(-4).toUpperCase()}</div>

      <div className="rcp-foot">— RETAIN FOR INFRASTRUCTURE AUDIT —</div>
    </div>
  );
}

/* =========================================================
   APP
   ========================================================= */

function App() {
  // tweaks
  const TWEAK_DEFAULS = /*EDITMODE-BEGIN*/{
    "sound": false,
    "fuelDuration": 5.0,
    "view": "bay",
    "showHelp": true
  }/*EDITMODE-END*/;
  const [t, setTweak] = useTweaks(TWEAK_DEFAULS);

  // data
  const [dataset, setDataset] = useState(FUEL_FALLBACK);
  const [apiStatus, setApiStatus] = useState("fallback"); // 'live' | 'fallback' | 'loading'

  // selections
  const [providerId, setProviderId] = useState("ant");
  const [modelId, setModelId]       = useState("ant-opus-4-1");
  const [taskId, setTaskId]         = useState("summarize_pdf");

  // session
  const [phase, setPhase] = useState("idle"); // idle | fueling | complete
  const [progress, setProgress] = useState(0); // 0..1
  const [pinned, setPinned] = useState([]);
  const [activeReceipt, setActiveReceipt] = useState(null);
  const [view, setView] = useState(t.view);

  // wall controls
  const [sortMode, setSortMode] = useState("price-asc");
  const [filterProvider, setFilterProvider] = useState("all");

  // try live API once
  useEffect(() => {
    let cancelled = false;
    setApiStatus("loading");
    (async () => {
      const json = await FUEL_FETCH_LIVE();
      if (cancelled) return;
      if (json && Array.isArray(json.data) && json.data.length) {
        try {
          const merged = mergeLive(FUEL_FALLBACK, json);
          setDataset(merged);
          setApiStatus("live");
        } catch (e) {
          setApiStatus("fallback");
        }
      } else {
        setApiStatus("fallback");
      }
    })();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => { Audio.setEnabled(!!t.sound); }, [t.sound]);
  useEffect(() => { setView(t.view); }, [t.view]);

  const provider = useMemo(() =>
    dataset.providers.find(p => p.id === providerId) || dataset.providers[0],
    [dataset, providerId]
  );
  const models   = useMemo(() =>
    dataset.models.filter(m => m.provider === providerId),
    [dataset, providerId]
  );
  const model    = useMemo(() => dataset.models.find(m => m.id === modelId), [dataset, modelId]);
  const task     = useMemo(() => FUEL_TASKS.find(x => x.id === taskId), [taskId]);

  // keep selection valid when provider changes
  useEffect(() => {
    if (!models.find(m => m.id === modelId)) {
      setModelId(models[0]?.id || "");
    }
  }, [providerId, models, modelId]);

  // computed
  const fullCost = task && model ? (task.tokens / 1_000_000) * model.input : 0;
  const liveTokens = Math.round(task ? task.tokens * progress : 0);
  const liveCost   = fullCost * progress;

  // pump # for current provider — deterministic but feels like an asset tag
  const pumpNo = useMemo(() => {
    if (!provider) return "00";
    const idx = dataset.providers.findIndex(p => p.id === provider.id);
    return String(2 + idx * 2).padStart(2, "0");
  }, [dataset, provider]);

  // fueling loop
  useEffect(() => {
    if (phase !== "fueling") {
      Audio.setFlow(0);
      return;
    }
    Audio.setFlow(0.5);
    const start = performance.now();
    const dur = Math.max(0.5, t.fuelDuration) * 1000;
    let lastClick = start;
    let iv;
    const tick = () => {
      const now = performance.now();
      const elapsed = now - start;
      const p = Math.min(1, elapsed / dur);
      setProgress(p);
      Audio.setFlow(0.3 + p * 0.5);
      if (now - lastClick > 120) {
        Audio.click(900 + Math.random() * 200, 0.025, 0.04);
        lastClick = now;
      }
      if (p >= 1) {
        clearInterval(iv);
        Audio.setFlow(0);
        Audio.beep(660, 0.12);
        setTimeout(() => Audio.beep(880, 0.18), 120);
        finishFueling();
      }
    };
    iv = setInterval(tick, 1000 / 30);
    return () => clearInterval(iv);
  }, [phase]);

  function startFueling() {
    if (!model || !task) return;
    setPhase("fueling");
    setProgress(0);
    setActiveReceipt(null);
    Audio.beep(440, 0.08, 0.05);
  }
  function finishFueling() {
    if (!model || !task || !provider) return;
    const cost = (task.tokens / 1_000_000) * model.input;
    const now = new Date();
    const time = now.toISOString().replace("T", " ").slice(0, 19);
    const sessionId = "TX-" + Math.random().toString(36).slice(2, 8).toUpperCase();
    const receipt = {
      id: sessionId,
      providerId: provider.id,
      providerName: provider.name,
      modelId: model.id,
      modelName: model.name,
      tier: model.tier,
      ctx: model.ctx,
      taskId: task.id,
      taskLabel: task.label,
      tokens: task.tokens,
      input: model.input,
      output: model.output,
      cost,
      time,
      sessionId,
      pumpNo,
    };
    setActiveReceipt(receipt);
    setProgress(1);
    setPhase("complete");
  }
  function abort() {
    Audio.click(220, 0.2, 0.08);
    setPhase("idle"); setProgress(0); setActiveReceipt(null);
  }
  function pinCurrent() {
    if (!activeReceipt) return;
    if (pinned.some(r => r.id === activeReceipt.id)) return;
    setPinned([activeReceipt, ...pinned]);
    Audio.click(1200, 0.05, 0.08);
  }
  function unpin(id) {
    setPinned(pinned.filter(r => r.id !== id));
    Audio.click(420, 0.04, 0.06);
  }

  // wall display
  const pStyle = PROVIDER_STYLE[provider?.id] || {};
  const cssVars = {
    "--prov-stripe": pStyle.stripe,
    "--prov-lcd": pStyle.lcd,
  };

  const wallReceipts = useMemo(() => {
    let list = [...pinned];
    if (filterProvider !== "all") list = list.filter(r => r.providerId === filterProvider);
    if (sortMode === "price-asc")  list.sort((a, b) => a.cost - b.cost);
    if (sortMode === "price-desc") list.sort((a, b) => b.cost - a.cost);
    if (sortMode === "recent")     list.sort((a, b) => b.time.localeCompare(a.time));
    if (sortMode === "provider")   list.sort((a, b) => a.providerName.localeCompare(b.providerName));
    return list;
  }, [pinned, sortMode, filterProvider]);

  const minCost = wallReceipts.length ? Math.min(...wallReceipts.map(r => r.cost)) : 0;
  const maxCost = wallReceipts.length ? Math.max(...wallReceipts.map(r => r.cost)) : 0;

  // pin available providers
  const wallProvidersAvailable = useMemo(() => {
    const set = new Set(pinned.map(r => r.providerId));
    return ["all", ...Array.from(set)];
  }, [pinned]);

  const isFueling = phase === "fueling";
  const isComplete = phase === "complete";

  return (
    <div className={"station-shell" + (isFueling ? " fueling" : "")}>
      {/* ========== TOP BAR ========== */}
      <header className="topbar">
        <div className="topbar-left">
          <div className="brand">
            <div className="brand-mark" />
            <div>
              <div className="brand-name">FUEL/STAT</div>
              <div className="brand-sub">INFERENCE REFUELING NETWORK · NODE 04</div>
            </div>
          </div>
        </div>
        <div className="view-toggle">
          <button className={view === "bay" ? "active" : ""} onClick={() => { setView("bay"); setTweak("view","bay"); }}>BAY</button>
          <button className={view === "wall" ? "active" : ""} onClick={() => { setView("wall"); setTweak("view","wall"); }}>
            PINBOARD · {pinned.length}
          </button>
        </div>
        <div className="topbar-right">
          <span className={"api-pill " + apiStatus}>
            <span className="led" />
            {apiStatus === "live" ? "LIVE FEED · LLM-STATS" : apiStatus === "loading" ? "FETCHING…" : "OFFLINE TARIFF SHEET"}
          </span>
          <span className="dot-led" />
          <span>STATION ACTIVE</span>
        </div>
      </header>

      {/* ========== MAIN ========== */}
      {view === "bay" ? (
        <main className="bay" style={cssVars} data-screen-label="01 Bay">
          {/* ---------- LEFT RAIL: SELECTOR ---------- */}
          <aside className="rail">
            <section className="rail-section">
              <div className="section-label">
                <span>STEP 01 · SELECT PROVIDER</span>
                <span className="tag">{dataset.providers.length}</span>
              </div>
              <div className="provider-grid">
                {dataset.providers.map(p => (
                  <button
                    key={p.id}
                    className={"provider-chip" + (p.id === providerId ? " active" : "")}
                    onClick={() => { setProviderId(p.id); Audio.click(1100, 0.03); }}
                  >
                    <span className="code">{p.code}</span>
                    <span className="name">{p.name}</span>
                    <span className="swatch" style={{ background: PROVIDER_STYLE[p.id]?.stripe }} />
                  </button>
                ))}
              </div>
            </section>

            <section className="rail-section flex">
              <div className="section-label">
                <span>STEP 02 · MODEL UNIT</span>
                <span>{models.length} AVAIL.</span>
              </div>
              <div className="model-list">
                {models.map(m => (
                  <div
                    key={m.id}
                    className={"model-row" + (m.id === modelId ? " active" : "")}
                    onClick={() => { setModelId(m.id); Audio.click(900, 0.03); }}
                  >
                    <div>
                      <div className="name">{m.name}</div>
                      <div className="tier">{m.tier} · {(m.ctx/1000).toFixed(0)}K CTX</div>
                    </div>
                    <div className="price">
                      ${m.input.toFixed(m.input < 1 ? 2 : 2)}
                      <small>IN /1M</small>
                    </div>
                  </div>
                ))}
              </div>
            </section>
          </aside>

          {/* ---------- CENTER: PUMP + ROBOT + TASKS ---------- */}
          <section className="bay-center">
            <div className="bay-header">
              <div className="lh">
                BAY {pumpNo} · STATUS<br/>
                <span style={{ color: phase === "idle" ? "var(--green-led)" : phase === "fueling" ? "var(--amber)" : "var(--green-led)" }}>
                  {phase === "idle" ? "● READY" : phase === "fueling" ? "● FLOWING" : "● COMPLETE"}
                </span>
              </div>
              <div>
                <h1>refueling.bay</h1>
                <div className="sub">SAME INPUT · DIFFERENT COST</div>
              </div>
              <div className="rh">
                NET / 04<br/>
                LINE PRESSURE NOMINAL
              </div>
            </div>

            <div className="stage">
              {/* PUMP */}
              <div className="pump" style={cssVars}>
                <div className="pump-cap">
                  <div>
                    <div className="pump-no">PUMP NO. {pumpNo}</div>
                    <div className="pump-name">{provider?.name}</div>
                  </div>
                  <div className="pump-stripe" />
                </div>

                <div className="lcd">
                  <div className="lcd-row">
                    <span className="k">MODEL</span>
                    <span className="v">{model?.name || "—"}</span>
                  </div>
                  <div className="lcd-row">
                    <span className="k">TIER</span>
                    <span className="v">{model?.tier || "—"}</span>
                  </div>
                  <div className="lcd-row">
                    <span className="k">RATE /1M</span>
                    <span className="v">${model?.input.toFixed(2)}</span>
                  </div>
                  <div className="lcd-row big">
                    <span className="k">TOKENS</span>
                    <span className="v">{liveTokens.toLocaleString()}</span>
                  </div>
                  <div className="lcd-row huge">
                    <span className="k">USD</span>
                    <span className="v">${liveCost.toFixed(4)}</span>
                  </div>
                </div>

                <div className="gauges">
                  <Gauge value={Math.round(progress * 100)} max={100} label="FLOW" unit="%" color={pStyle.lcd} />
                  <Gauge value={Math.round(progress * 80 + 12)} max={100} label="PSI" unit="" color={pStyle.lcd} />
                </div>

                <div className="pump-base">
                  <div className="nozzle-slot">
                    <div className="micro">GRADE</div>
                    <div className="val-mono">{model?.tier || "—"}</div>
                  </div>
                  <div className="grade-slot">
                    <div className="micro">OUT /1M</div>
                    <div className="val-mono">${model?.output.toFixed(2)}</div>
                  </div>
                </div>

                {/* hose to robot */}
                <div className="hose">
                  <Hose active={isFueling} color={pStyle.lcd || "#ff9e3d"} />
                </div>
              </div>

              {/* ROBOT */}
              <div className="robot-bay">
                <div className="bay-lights">
                  <span className={"lt" + (phase === "idle" ? " on green" : "")} />
                  <span className={"lt" + (phase === "fueling" ? " on amber" : "")} />
                  <span className={"lt" + (isFueling && progress > 0.85 ? " on red" : "")} />
                </div>
                <div className="robot">
                  <Robot fueling={isFueling} completePulse={isComplete} />
                  <div className="robot-plate">UNIT // {model?.id.slice(-6).toUpperCase() || "------"}</div>
                </div>
                <div className="bay-strobe" />
              </div>

              {/* TASK COLUMN */}
              <div className="task-col">
                <div className="task-header">
                  <div className="h">STEP 03 · TASK</div>
                  <div className="meta">FIXED INPUT QTY</div>
                </div>
                <div className="task-list">
                  {FUEL_TASKS.map(tk => (
                    <div
                      key={tk.id}
                      className={"task-card" + (tk.id === taskId ? " active" : "")}
                      onClick={() => { setTaskId(tk.id); Audio.click(800, 0.03); }}
                    >
                      <div className="task-shape">
                        <TaskShape shape={tk.shape} active={tk.id === taskId} />
                      </div>
                      <div>
                        <div className="lab">{tk.label}</div>
                        <div className="sub">{tk.sub}</div>
                      </div>
                      <div className="tk">
                        {(tk.tokens/1000).toFixed(0)}K
                        <small>TOKENS</small>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* COMMAND BAR */}
            <div className="command-bar">
              <div className="command-meta">
                <div className="row">
                  <span>BAY <b>{pumpNo}</b></span>
                  <span>UNIT <b>MDL-U/4407</b></span>
                  <span>SESSION <b>{activeReceipt?.sessionId || (isFueling ? "OPENING…" : "STANDBY")}</b></span>
                </div>
                <div className="row">
                  <span>EST. COST <b>${fullCost.toFixed(4)}</b></span>
                  <span>INPUT <b>{task?.tokens.toLocaleString()}</b> TOK</span>
                  <span>RATE <b>${model?.input.toFixed(2)}</b>/1M</span>
                </div>
              </div>

              {phase === "fueling" ? (
                <button className="kill-btn" onClick={abort}>⌧ ABORT</button>
              ) : phase === "complete" ? (
                <button
                  className="big-btn"
                  onClick={() => { pinCurrent(); setPhase("idle"); setProgress(0); }}
                >
                  PIN TO BOARD <span className="arrow">→</span>
                </button>
              ) : (
                <button
                  className="big-btn"
                  disabled={!model || !task}
                  onClick={startFueling}
                >
                  INITIATE FUELING <span className="arrow">▶</span>
                </button>
              )}

              <div className="command-status">
                <div className="big">${liveCost.toFixed(4)}</div>
                <div>RUNNING TOTAL · USD</div>
              </div>
            </div>
          </section>

          {/* ---------- RIGHT RAIL: PRINTER ---------- */}
          <aside className="printer">
            <div className="printer-head">
              <div className="h">THERMAL OUTPUT</div>
              <div className="sub">RECEIPT · PRINTER 04-A</div>
              <div className="slot" />
            </div>
            <div className={"printer-feed" + (isFueling ? " printing" : "")}>
              {activeReceipt ? (
                <Receipt rcpt={activeReceipt} />
              ) : isFueling ? (
                <div className="printer-empty">
                  <div className="icon" style={{ animation: "feed 0.2s linear infinite" }} />
                  TRANSACTING<br/>
                  <small style={{ display:"block", marginTop:8, opacity:.6 }}>{Math.round(progress * 100)}%</small>
                </div>
              ) : (
                <div className="printer-empty">
                  <div className="icon" />
                  AWAITING SESSION<br/>
                  <small style={{ display:"block", marginTop:8, opacity:.6 }}>RECEIPT WILL DISPENSE</small>
                </div>
              )}
            </div>
            <div className="printer-actions">
              <button onClick={pinCurrent} disabled={!activeReceipt}>PIN TO BOARD</button>
              <button onClick={() => { setActiveReceipt(null); setPhase("idle"); setProgress(0); }} disabled={!activeReceipt && phase === "idle"}>CLEAR</button>
            </div>
          </aside>
        </main>
      ) : (
        <main className="wall" data-screen-label="02 Pinboard">
          <div className="wall-bar">
            <div>
              <h2>pinboard.04</h2>
              <div className="sub">{pinned.length} RECEIPT{pinned.length === 1 ? "" : "S"} · ARCHIVE OF FUELING SESSIONS</div>
            </div>
            <div />
            <div className="wall-controls">
              <div className="group">
                <button className={sortMode === "price-asc" ? "active" : ""} onClick={() => setSortMode("price-asc")}>$ ASC</button>
                <button className={sortMode === "price-desc" ? "active" : ""} onClick={() => setSortMode("price-desc")}>$ DESC</button>
                <button className={sortMode === "recent" ? "active" : ""} onClick={() => setSortMode("recent")}>RECENT</button>
                <button className={sortMode === "provider" ? "active" : ""} onClick={() => setSortMode("provider")}>PROVIDER</button>
              </div>
              <div className="group">
                {wallProvidersAvailable.map(pid => (
                  <button
                    key={pid}
                    className={filterProvider === pid ? "active" : ""}
                    onClick={() => setFilterProvider(pid)}
                  >
                    {pid === "all" ? "ALL" : dataset.providers.find(p => p.id === pid)?.code || pid}
                  </button>
                ))}
              </div>
            </div>
          </div>

          <div className="wall-grid">
            {wallReceipts.length === 0 ? (
              <div className="wall-empty">
                <b>no receipts pinned</b>
                fuel a model in the bay to begin
              </div>
            ) : wallReceipts.map((r, i) => (
              <div
                key={r.id}
                className={
                  "wall-cell"
                  + (wallReceipts.length > 1 && r.cost === minCost ? " cheapest" : "")
                  + (wallReceipts.length > 1 && r.cost === maxCost && r.cost !== minCost ? " priciest" : "")
                }
              >
                <span className="pin" />
                <button className="unpin" onClick={() => unpin(r.id)}>✕</button>
                <Receipt rcpt={r} compact />
              </div>
            ))}
          </div>
        </main>
      )}

      {/* ========== FOOTER ========== */}
      <footer className="footer">
        <div>
          <span className="footer-data">
            <b>{dataset.models.length}</b> MODEL UNITS · <b>{dataset.providers.length}</b> PROVIDERS
          </span>
        </div>
        <div className="center">
          {phase === "fueling"
            ? <>FLOWING · <b style={{color:"var(--amber)"}}>{Math.round(progress * 100)}%</b> · DO NOT DISCONNECT</>
            : phase === "complete"
              ? <>SESSION COMPLETE · RECEIPT READY · PIN TO BOARD</>
              : <>STATION READY · SELECT PROVIDER, MODEL, AND TASK TO BEGIN</>
          }
        </div>
        <div className="right">
          <span className="footer-data">CALIBRATED <b>{new Date().toISOString().slice(0,10)}</b></span>
        </div>
      </footer>

      {/* ========== TWEAKS PANEL ========== */}
      <TweaksPanel title="TWEAKS">
        <TweakSection title="STATION">
          <TweakRadio
            label="View"
            value={t.view}
            options={[{label:"BAY", value:"bay"},{label:"PINBOARD", value:"wall"}]}
            onChange={v => { setTweak("view", v); setView(v); }}
          />
          <TweakSlider
            label="Fueling duration"
            value={t.fuelDuration}
            min={1.5} max={12} step={0.5}
            onChange={v => setTweak("fuelDuration", v)}
            suffix="s"
          />
          <TweakToggle
            label="Industrial sound"
            value={t.sound}
            onChange={v => setTweak("sound", v)}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

// merge live API data on top of fallback. Conservative — only override
// fields we recognize; keep fallback metadata otherwise.
function mergeLive(fallback, live) {
  // The exact LLM Stats shape is documented but we keep mapping defensive.
  const arr = live.data || live.models || [];
  if (!Array.isArray(arr) || !arr.length) return fallback;

  const out = JSON.parse(JSON.stringify(fallback));
  let mapped = 0;
  for (const item of arr) {
    const id = item.id || item.model_id;
    const pricing = item.pricing || item;
    const input = Number(pricing.input ?? pricing.input_per_1m ?? pricing.input_price_per_1m_tokens);
    const output = Number(pricing.output ?? pricing.output_per_1m ?? pricing.output_price_per_1m_tokens);
    if (!id || !isFinite(input) || !isFinite(output)) continue;
    // try to find matching fallback model by id substring
    const target = out.models.find(m => id.toLowerCase().includes(m.id.split("-").slice(1).join("-")));
    if (target) {
      target.input = input; target.output = output;
      mapped++;
    }
  }
  if (!mapped) return fallback;
  out.generated = "live-" + new Date().toISOString().slice(0, 10);
  return out;
}
