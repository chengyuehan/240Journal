var(--muted)}.card.accent{border-top:3px solid var(--blue)}.panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.toolbar{padding:17px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line)}.digital-stack{display:flex;flex-direction:column;gap:0;min-width:0}.digital-stack>.card{width:100%}.p5-filters{position:relative;margin:12px 0 0 12px;padding:12px;background:#eaf4f8;border-left:3px solid var(--blue);border-radius:0 12px 12px 12px;box-shadow:inset 0 0 0 1px #d9e6eb}.p5-filters::before{content:"";position:absolute;left:-3px;top:-13px;height:13px;border-left:3px solid var(--blue)}.p5-heading{margin:0 0 9px;color:var(--navy);font-size:12px;font-weight:800}.p5-options{display:grid;gap:6px}.p5-option{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 9px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink);text-align:left;font:inherit;font-size:12px;cursor:pointer}.p5-option:hover{background:white;border-color:var(--line)}.p5-option.active{background:var(--navy);color:white}.p5-option strong{font-size:12px}.p5-option .p5-num{min-width:23px;text-align:center;border-radius:20px;padding:1px 6px;background:#ffffffa8;color:var(--navy);font-weight:800}.p5-option.active .p5-num{background:#ffffff2b;color:white}input,select,button{font:inherit}input,select{height:42px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:0 12px;outline:none}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #147ca31c}#search{flex:1;min-width:230px}.toolbar select{min-width:155px}.count{margin-left:auto;color:var(--muted);font-size:13px}.reset{border:0;background:#eaf3f7;color:var(--navy);font-weight:700;border-radius:9px;padding:0 15px;height:42px;cursor:pointer}.scroll{overflow:auto;max-height:65vh}table{width:100%;border-collapse:collapse;min-width:820px}thead{position:sticky;top:0;z-index:2;background:var(--navy);color:white}th{font-size:12px;text-align:left;letter-spacing:.025em;padding:13px 14px;white-space:nowrap;cursor:pointer;user-select:none}th:hover{background:#195774}td{padding:13px 14px;vertical-align:top;border-bottom:1px solid #e8eff2;font-size:13px}tbody tr:hover{background:#f1f9fc}.num{font-weight:800;color:var(--blue);width:60px}.repo{font-weight:700;white-space:normal;overflow-wrap:anywhere;min-width:155px;max-width:220px}.repo a{color:var(--navy);text-decoration:none}.repo a:hover{color:var(--blue);text-decoration:underline}.project{min-width:250px;max-width:380px}.evidence{min-width:280px;max-width:390px;color:#5e7580}.url{display:inline-block;margin-top:5px;color:var(--blue);font-size:11px;overflow-wrap:anywhere}.pill{display:inline-block;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:750;white-space:nowrap}.digital{background:#e4f2ff;color:#155a8a}.physical{background:#fff1df;color:#8a5010}.mixed{background:#f0eaff;color:#6344a4}.week{background:#f1f3f4;color:#58666d}.template{background:#e9eef0;color:#52636c}.p5yes{background:#dcf5e8;color:#167348}.p5other{background:#e4effa;color:#285f91}.p5unknown{background:#fff2d6;color:#855c11}.na{background:#eff2f3;color:#697980}.status{white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:50px}.foot{display:flex;justify-content:space-between;gap:16px;padding:13px 17px;color:var(--muted);font-size:12px}.foot b{color:var(--navy)}@media(max-width:800px){.wrap{padding:22px 14px 40px}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:28px}.cards{grid-template-columns:repeat(2,1fr)}.count{width:100%;margin:0}}

<body><main class="wrap">
<header class="top"><div><div class="eyebrow">DES240 · PROJECT INDEX</div><h1>Making Journal Project Explorer</h1><p>29 student projects · Browse by format and check tools used in digital projects.</p></div><div class="total"><strong id="totalCount">29</strong><span>student projects</span></div></header>

<script>
const rows = [{"repo":"akim318/MakingJournalAra","url":"https://akim318.github.io/MakingJournalAra/","type":"Digital","title":"Ocean data portrait translating whale sharks, plankton, and marine conditions into animated visuals.","p5":"Confirmed: p5.js","evidence":"Week 11 explicitly says the work was built in p5.js."},{"repo":"iosefomon35/makingjournal1","url":"https://iosefomon35.github.io/makingjournal1/","type":"Digital","title":"A mobile app prototype about loneliness and mental well-being, with interface and user flows developed in Figma.","p5":"Confirmed: Other Tools","evidence":"Week 11 records the use of Figma to create and refine the prototype."},{"repo":"mrey942-cloud/Making-Journal","url":"https://mrey942-cloud.github.io/Making-Journal/","type":"Physical","title":"Friendship Maintenance Over Distance: a physical data portrait made from a wooden board, thread, and beads.","p5":"Not applicable","evidence":"The Week 12 project statement and final photos show a physical installation."},{"repo":"ecza733/Making-Journal","url":"https://ecza733.github.io/Making-Journal/","type":"Digital","title":"Happy Place: an interactive 3D archive of memories made with Unreal Engine.","p5":"Confirmed: Other Tools","evidence":"Week 12 explicitly identifies Unreal Engine."},{"repo":"Jeffcai0502/Making-journal","url":"https://jeffcai0502.github.io/Making-journal/","type":"Digital","title":"Interactive Data Mirror: a website that records audience behaviour and generates personalised characters and feedback.","p5":"Confirmed: p5.js","evidence":"Week 12 calls it a p5.js website and links to p5.js."},{"repo":"Pakhip/Making-Journal","url":"https://pakhip.github.io/Making-Journal/","type":"Physical","title":"Whispers of Care: a handmade paper sculpture of plants, using leaves, colour, and form to represent community care data.","p5":"Not applicable","evidence":"Week 12 text and project photos show the handmade paper sculpture."},{"repo":"aguo795-ime/making-journal","url":"https://aguo795-ime.github.io/making-journal/","type":"Physical","title":"A physical prototype about commuting, combining hand-drawn elements and a map to express travel experiences.","p5":"Not applicable","evidence":"The Week 12 page labels it “Final Physical Prototype.”"},{"repo":"JayPatel1125/Making-Journal","url":"https://jaypatel1125.github.io/Making-Journal/","type":"Digital","title":"Quantifying the Fragmented Mind: an interactive sound work showing sound interference and thought patterns.","p5":"Confirmed: p5.js","evidence":"Week 12 mentions the final p5.js work and interaction sketches."},{"repo":"celcarix/making-journal","url":"https://celcarix.github.io/making-journal/","type":"Mixed","title":"Moments of Joy: a handmade pop-up book paired with an emotion-focused interactive webpage accessed by QR code.","p5":"Confirmed: No p5.js","evidence":"Week 12 confirms the physical book and digital webpage; it does not identify the webpage framework."},{"repo":"Yuhao018/Making-Journal","url":"https://yuhao018.github.io/Making-Journal/","type":"Digital","title":"An interactive map of visitors arriving in New Zealand, with filters, time controls, and data comparisons.","p5":"Confirmed: p5.js","evidence":"Week 12 provides a p5.js project link."},{"repo":"LunyingN1ce/making-journal","url":"https://lunyingn1ce.github.io/making-journal/","type":"Digital","title":"Emotion Awareness Tool: a journalling and visualisation tool showing emotional changes, triggers, and trends.","p5":"Confirmed: p5.js","evidence":"Week 12 explicitly says p5.js is used and embeds an interactive sketch."},{"repo":"nbar185-maker/making-journal","url":"https://nbar185-maker.github.io/making-journal/","type":"Physical","title":"A physical landscape made from recycled PLA, representing plastic waste produced in the design studio.","p5":"Not applicable","evidence":"The Week 12 project statement calls it a physical data visualisation."},{"repo":"Eva2020424/making-journal","url":"https://eva2020424.github.io/making-journal/","type":"Digital","title":"Signals After Midnight: an interactive work about phone use, loneliness, and how systems interpret emotional data.","p5":"Confirmed: p5.js","evidence":"Week 12 embeds the p5.js Web Editor."},{"repo":"aslu778/making-journal","url":"https://aslu778.github.io/making-journal/","type":"Digital","title":"An interactive commuting-data interface comparing a hand-drawn experience layer with a simulated traffic dashboard. No clear final outcome is shown; limited reference value.","p5":"Unconfirmed","evidence":"Week 12 describes an interactive interface, but no clear final outcome is shown and no development tool is identified; limited reference value."},{"repo":"zheweixu84/making-journal","url":"https://zheweixu84.github.io/making-journal/","type":"Mixed","title":"Receipts of Relationships: a hanging thermal-receipt installation with software that generates and prints relationship receipts.","p5":"Confirmed: No p5.js","evidence":"Weeks 5, 10, 11, and 12 document the physical installation and printing software; the software stack is not specified."},{"repo":"Ori2056/Making_Journal_Ori","url":"https://ori2056.github.io/Making_Journal_Ori/","type":"Digital","title":"A chat-analysis app prototype that runs in a browser and requires users to enter text manually.","p5":"Confirmed: Other Tools","evidence":"Weeks 10–11 show a browser-based app prototype with manual text entry; automatic chat reading and Electron deployment were not implemented."},{"repo":"harrisonwu23/making-journal-240","url":"https://harrisonwu23.github.io/making-journal-240/","type":"Digital","title":"A p5.js interactive work is embedded in the Week 12 page; the journal gives little detail about its subject.","p5":"Confirmed: p5.js","evidence":"The Week 12 page embeds the p5.js Web Editor."},{"repo":"alissa389/making-journal-alissa","url":"https://alissa389.github.io/making-journal-alissa/","type":"Physical","title":"Foundations of Identity: a physical data sculpture made from transparent acrylic layers, exploring how relationships shape identity.","p5":"Not applicable","evidence":"The Week 12 project statement and final photos show the physical sculpture."},{"repo":"zlatictik/Making-Journal-DES240","url":"https://zlatictik.github.io/Making-Journal-DES240/","type":"Incomplete through Week 4","title":"The pages after Week 4 remain template content; no later project record is visible.","p5":"Unconfirmed","evidence":"The journal is documented through Week 4 only."},{"repo":"Johnny19323-design/Design-240-making-journal","url":"https://johnny19323-design.github.io/Design-240-making-journal/","type":"Digital","title":"A campsite route-planning map with route filters, comparisons, and campsite details.","p5":"Unconfirmed","evidence":"The Week 12 statement confirms a web-based interactive visualisation but does not identify the technology stack."},{"repo":"Hankuir/Making-Journal---Hannah-Kuiler","url":"https://hankuir.github.io/Making-Journal---Hannah-Kuiler/","type":"Incomplete through Week 5","title":"The Week 5 proposal planned an interactive website about phone-use habits; later weeks contain no project record.","p5":"Unconfirmed","evidence":"The journal is documented through Week 5 only; the final outcome is unconfirmed."},{"repo":"jtran-hub/My-Making-Journal-","url":"https://jtran-hub.github.io/My-Making-Journal-/","type":"Incomplete through Week 4","title":"The journal ends at Week 4; no project proposal or final outcome is documented.","p5":"Unconfirmed","evidence":"The journal is documented through Week 4 only."},{"repo":"lele859zzz/des240-making-journal","url":"https://lele859zzz.github.io/des240-making-journal/","type":"Physical","title":"Safe Waters: a fish-shaped physical data visualisation showing water quality in New Zealand.","p5":"Not applicable","evidence":"Week 12 explicitly describes a physical, fish-shaped artefact."},{"repo":"hyun986-spec/hyun986-making-journal","url":"https://hyun986-spec.github.io/hyun986-making-journal/","type":"Digital","title":"An interactive visualisation based on survey data from 53 participants.","p5":"Confirmed: p5.js","evidence":"The Week 12 final page embeds the p5.js Web Editor."},{"repo":"nrid934/DES240-Making-Journal-Nahlah-Ridwan","url":"https://nrid934.github.io/DES240-Making-Journal-Nahlah-Ridwan/","type":"Physical","title":"A physical map artwork about stray-cat data in Auckland.","p5":"Not applicable","evidence":"The Week 12 title labels it “Final Physical Project.”"},{"repo":"yhan337-alt/Making-journal","url":"https://yhan337-alt.github.io/Making-journal/","type":"Physical","title":"A black-box installation using anonymous responses and collected marbles to represent silence in the classroom.","p5":"Not applicable","evidence":"The Week 12 statement describes the physical materials, black box, and marble archive."},{"repo":"WeirdoJimbo/Making-Journal---Jimmy","url":"https://weirdojimbo.github.io/Making-Journal---Jimmy/","type":"Physical","title":"Hesperides: a consumer-data artwork made from laser-cut wood and 3D-printed apples.","p5":"Not applicable","evidence":"Week 12 explicitly describes a physical data visualisation."},{"repo":"sset540/Making-Journal-Final","url":"https://sset540.github.io/Making-Journal-Final/","type":"Digital","title":"A Spotify mood-data portrait. No clear final outcome is shown; limited reference value.","p5":"Unconfirmed","evidence":"The Week 5 proposal mentions p5.js; the last record mentions a browser sketch but shows no clear final outcome and does not confirm the framework. Limited reference value."},{"repo":"Soraph10/Making-Journal","url":"https://soraph10.github.io/Making-Journal/","type":"Incomplete through Week 6","title":"The visible journal ends at Week 6; no final outcome is documented.","p5":"Unconfirmed","evidence":"The journal is documented through Week 6 only."}];
const typeOrder=['Digital','Physical','Mixed','Incomplete through Week 4','Incomplete through Week 5','Incomplete through Week 6'];
const typeClass={'Digital':'digital','Physical':'physical','Mixed':'mixed','Incomplete through Week 4':'week','Incomplete through Week 5':'week','Incomplete through Week 6':'week'};
const pClass={'Confirmed: p5.js':'p5yes','Confirmed: No p5.js':'na','Confirmed: Other Tools':'p5other','Unconfirmed':'p5unknown','Not applicable':'na'};
let selectedType='Digital';

function badge(s,cls){return `<span class="pill ${cls}">${s}</span>`}
function renderCards(){const count=t=>rows.filter(x=>t==='Incomplete Records'?x.type.startsWith('Incomplete through Week'):x.type===t).length;const vals=[['Physical','Physical Projects','Physical work'],['Mixed','Mixed Projects','Physical + digital'],['Incomplete Records','Incomplete Records','Last documented week']];const digital=`<div class="digital-stack"><button class="card accent category-card ${selectedType==='Digital'?'active':''}" data-type="Digital" aria-pressed="${selectedType==='Digital'}"><span>Digital Projects</span><strong>${count('Digital')}</strong><small>Digital work</small></button><div id="p5Filters" class="p5-filters" ${selectedType==='Digital'?'':'hidden'}></div></div>`;document.querySelector('#cards').innerHTML=digital+vals.map(([key,label,note])=>`<button class="card accent category-card ${selectedType===key?'active':''}" data-type="${key}" aria-pressed="${selectedType===key}"><span>${label}</span><strong>${count(key)}</strong><small>${note}</small></button>`).join('');document.querySelectorAll('#cards .category-card').forEach(card=>card.addEventListener('click',()=>{selectedType=selectedType===card.dataset.type?'':card.dataset.type;selectedP5='';render()}))}

let sortKey='', sortDir=1, selectedP5='';
function filtered(){return rows.filter(x=>{const typeMatch=!selectedType||(selectedType==='Incomplete Records'?x.type.startsWith('Incomplete through Week'):x.type===selectedType);return typeMatch&&(!selectedP5||x.p5===selectedP5)}).sort((a,b)=>{if(!sortKey)return 0;let x=a[sortKey],y=b[sortKey];return String(x).localeCompare(String(y),'en')*sortDir})}
function render(){const data=filtered();renderCards();const p5Mode=selectedType==='Digital';const filters=document.querySelector('#p5Filters');const showP5Column=p5Mode&&!selectedP5;document.querySelector('#p5Header').hidden=!showP5Column;if(p5Mode){const opts=[['','All Digital Projects'],['Confirmed: p5.js','Confirmed: p5.js'],['Confirmed: Other Tools','Confirmed: Other Tools'],['Unconfirmed','Unconfirmed']];filters.innerHTML='<div class="p5-heading">p5.js Check</div><div class="p5-options">'+opts.map(([value,label])=>{const n=rows.filter(x=>x.type==='Digital'&&(!value||x.p5===value)).length;return `<button class="p5-option ${selectedP5===value?'active':''}" data-value="${value}" aria-pressed="${selectedP5===value}"><span>${label}</span><span class="p5-num">${n}</span></button>`}).join('')+'</div>';filters.querySelectorAll('.p5-option').forEach(btn=>btn.addEventListener('click',()=>{selectedP5=btn.dataset.value;render()}))}document.querySelector('#count').textContent=`Showing ${data.length} / ${rows.length} projects`;document.querySelector('#footCount').textContent=`${data.length} / ${rows.length}`;const body=document.querySelector('#body');body.innerHTML=data.map(x=>`<tr><td class="repo"><a href="${x.url}" target="_blank" rel="noopener">${x.repo}</a><br><a class="url" href="${x.url}" target="_blank" rel="noopener">Open GitHub Pages ↗</a></td><td class="project">${x.title}</td>${showP5Column?`<td class="status">${badge(x.p5,pClass[x.p5]||'na')}</td>`:''}</tr>`).join('');document.querySelector('#empty').hidden=data.length>0;document.querySelector('#totalCount').textContent=rows.length}

document.querySelectorAll('th[data-key]').forEach(th=>th.addEventListener('click',()=>{if(th.dataset.key==='p5'&&selectedType!=='Digital')return;const key=th.dataset.key;sortDir=key===sortKey?-sortDir:1;sortKey=key;render()}));render();
</script></body></html>
