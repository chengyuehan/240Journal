n:sticky;top:0;z-index:2;background:var(--navy);color:white}th{font-size:12px;text-align:left;letter-spacing:.025em;padding:13px 14px;white-space:nowrap;cursor:pointer;user-select:none}th:hover{background:#195774}td{padding:13px 14px;vertical-align:top;border-bottom:1px solid #e8eff2;font-size:13px}tbody tr:hover{background:#f1f9fc}.num{font-weight:800;color:var(--blue);width:60px}.repo{font-weight:700;white-space:normal;overflow-wrap:anywhere;min-width:155px;max-width:220px}.repo a{color:var(--navy);text-decoration:none}.repo a:hover{color:var(--blue);text-decoration:underline}.project{min-width:250px;max-width:380px}.evidence{min-width:280px;max-width:390px;color:#5e7580}.url{display:inline-block;margin-top:5px;color:var(--blue);font-size:11px;overflow-wrap:anywhere}.pill{display:inline-block;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:750;white-space:nowrap}.digital{background:#e4f2ff;color:#155a8a}.physical{background:#fff1df;color:#8a5010}.mixed{background:#f0eaff;color:#6344a4}.week{background:#f1f3f4;color:#58666d}.template{background:#e9eef0;color:#52636c}.p5yes{background:#dcf5e8;color:#167348}.p5other{background:#e4effa;color:#285f91}.p5unknown{background:#fff2d6;color:#855c11}.na{background:#eff2f3;color:#697980}.status{white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:50px}.foot{display:flex;justify-content:space-between;gap:16px;padding:13px 17px;color:var(--muted);font-size:12px}.foot b{color:var(--navy)}@media(max-width:800px){.wrap{padding:22px 14px 40px}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:28px}.cards{grid-template-columns:repeat(2,1fr)}.count{width:100%;margin:0}}

<body><main class="wrap">
<header class="top"><div><div class="eyebrow">DES240 · PROJECT INDEX</div><h1>Making Journal 项目智能表</h1><p>29 个学生项目 · 按作品媒介分类，核对数字项目的制作工具。</p></div><div class="total"><strong id="totalCount">29</strong><span>条项目记录</span></div></header>

<script>
const rows = [{"id":1,"repo":"akim318/MakingJournalAra","url":"https://akim318.github.io/MakingJournalAra/","type":"数字","title":"海洋数据肖像，将鲸鲨、浮游生物和海洋环境数据转成动态画面。","p5":"确认使用 p5.js","evidence":"第11周明确写明作品 Built in p5.js。"},{"id":2,"repo":"iosefomon35/makingjournal1","url":"https://iosefomon35.github.io/makingjournal1/","type":"数字","title":"孤独与身心健康手机应用原型，以 Figma 迭代界面和用户流程。","p5":"确认其他工具","evidence":"第11周记录说明使用 Figma 制作与改进原型。"},{"id":3,"repo":"mrey942-cloud/Making-Journal","url":"https://mrey942-cloud.github.io/Making-Journal/","type":"实体","title":"Friendship Maintenance Over Distance：木板、串线和珠子构成的实体数据肖像。","p5":"不适用","evidence":"第12周项目陈述和成品照片均显示实体装置。"},{"id":4,"repo":"ecza733/Making-Journal","url":"https://ecza733.github.io/Making-Journal/","type":"数字","title":"Happy Place：用 Unreal Engine 制作的互动3D记忆档案。","p5":"确认其他工具","evidence":"第12周明确说明使用 Unreal Engine。"},{"id":5,"repo":"Jeffcai0502/Making-journal","url":"https://jeffcai0502.github.io/Making-journal/","type":"数字","title":"Interactive Data Mirror：记录观众行为并生成个性化角色与反馈的网站。","p5":"确认使用 p5.js","evidence":"第12周明确称为 p5.js 网站并提供 p5.js 链接。"},{"id":6,"repo":"Pakhip/Making-Journal","url":"https://pakhip.github.io/Making-Journal/","type":"实体","title":"Whispers of Care：手工纸雕植物，以叶片、颜色和形态呈现社区关怀数据。","p5":"不适用","evidence":"第12周文字与项目照片确认手工纸雕作品。"},{"id":7,"repo":"aguo795-ime/making-journal","url":"https://aguo795-ime.github.io/making-journal/","type":"实体","title":"通勤数据实体原型，结合手绘元素与地图表达出行体验。","p5":"不适用","evidence":"第12周页面标注 Final Physical Prototype。"},{"id":8,"repo":"JayPatel1125/Making-Journal","url":"https://jaypatel1125.github.io/Making-Journal/","type":"数字","title":"Quantifying the Fragmented Mind：声音互动作品，呈现声音干扰与思绪数据。","p5":"确认使用 p5.js","evidence":"第12周提及最终 p5.js 作品及交互草图。"},{"id":9,"repo":"celcarix/making-journal","url":"https://celcarix.github.io/making-journal/","type":"混合","title":"Moments of Joy：手工立体书为主体，附有扫码进入的情绪互动网页。","p5":"确认未使用 p5.js","evidence":"第12周记录确认实体书与数字网页结合；网页框架未说明。"},{"id":10,"repo":"Yuhao018/Making-Journal","url":"https://yuhao018.github.io/Making-Journal/","type":"数字","title":"新西兰入境游客互动地图，支持筛选、时间控制和数据比较。","p5":"确认使用 p5.js","evidence":"第12周提供 p5.js 项目链接。"},{"id":11,"repo":"LunyingN1ce/making-journal","url":"https://lunyingn1ce.github.io/making-journal/","type":"数字","title":"Emotion Awareness Tool：情绪记录与可视化工具，呈现情绪变化、触发因素和趋势。","p5":"确认使用 p5.js","evidence":"第12周明确称使用 p5.js 并嵌入互动草图。"},{"id":12,"repo":"nbar185-maker/making-journal","url":"https://nbar185-maker.github.io/making-journal/","type":"实体","title":"用回收 PLA 制作的实体景观，呈现设计工作室产生的塑料废料。","p5":"不适用","evidence":"第12周项目陈述明确称 physical data visualisation。"},{"id":13,"repo":"Eva2020424/making-journal","url":"https://eva2020424.github.io/making-journal/","type":"数字","title":"Signals After Midnight：互动呈现手机使用、孤独感与系统对情绪数据的解读。","p5":"确认使用 p5.js","evidence":"第12周嵌入 p5.js Web Editor。"},{"id":14,"repo":"aslu778/making-journal","url":"https://aslu778.github.io/making-journal/","type":"数字","title":"通勤数据互动界面，对照手绘体验层和模拟交通优化仪表板；未见明确最终成品，参考性较低。","p5":"未确认","evidence":"第12周陈述说明互动界面，但未见明确最终成品；未说明开发工具，参考性较低。"},{"id":15,"repo":"zheweixu84/making-journal","url":"https://zheweixu84.github.io/making-journal/","type":"混合","title":"Receipts of Relationships：悬挂式热敏纸收据装置，配有生成并即时打印关系收据的软件。","p5":"确认未使用 p5.js","evidence":"第5、10、11、12周记录确认实体装置与打印程序；程序技术栈未说明。"},{"id":16,"repo":"Ori2056/Making_Journal_Ori","url":"https://ori2056.github.io/Making_Journal_Ori/","type":"数字","title":"聊天分析应用原型；最终记录称应用在浏览器运行、需手动输入文本。","p5":"确认其他工具","evidence":"第10至11周记录显示浏览器应用原型，需手动输入文本；自动读取聊天和 Electron 运行未实现。"},{"id":17,"repo":"harrisonwu23/making-journal-240","url":"https://harrisonwu23.github.io/making-journal-240/","type":"数字","title":"第12周嵌有 p5.js 互动作品；日志对作品内容说明较少。","p5":"确认使用 p5.js","evidence":"第12周页面嵌入 p5.js Web Editor。"},{"id":18,"repo":"alissa389/making-journal-alissa","url":"https://alissa389.github.io/making-journal-alissa/","type":"实体","title":"Foundations of Identity：由透明亚克力层构成的实体数据雕塑，呈现关系对身份的影响。","p5":"不适用","evidence":"第12周项目陈述图和成品照片显示实体雕塑。"},{"id":19,"repo":"zlatictik/Making-Journal-DES240","url":"https://zlatictik.github.io/Making-Journal-DES240/","type":"只记录到第四周","title":"第5至11周页面仍为模板内容，未见后续项目记录。","p5":"未确认","evidence":"按用户标注，日志只写到第四周。"},{"id":20,"repo":"Johnny19323-design/Design-240-making-journal","url":"https://johnny19323-design.github.io/Design-240-making-journal/","type":"数字","title":"露营地路线推荐地图，支持路线筛选、比较和营地信息查看。","p5":"未确认","evidence":"第12周项目陈述确认是 web-based interactive visualisation；未说明技术栈。"},{"id":21,"repo":"Hankuir/Making-Journal---Hannah-Kuiler","url":"https://hankuir.github.io/Making-Journal---Hannah-Kuiler/","type":"只记录到第五周","title":"第5周提案计划做展示手机使用习惯的互动网站；后续周页面没有项目记录。","p5":"未确认","evidence":"按用户标注，日志只写到第五周；最终成果未确认。"},{"id":22,"repo":"jtran-hub/My-Making-Journal-","url":"https://jtran-hub.github.io/My-Making-Journal-/","type":"只记录到第四周","title":"日志只到第四周，未见项目提案或最终成果记录。","p5":"未确认","evidence":"按用户标注，日志只写到第四周。"},{"id":23,"repo":"lele859zzz/des240-making-journal","url":"https://lele859zzz.github.io/des240-making-journal/","type":"实体","title":"Safe Waters：鱼形实体数据可视化，呈现新西兰水域水质情况。","p5":"不适用","evidence":"第12周明确描述为 physical fish-shaped artefact。"},{"id":24,"repo":"hyun986-spec/hyun986-making-journal","url":"https://hyun986-spec.github.io/hyun986-making-journal/","type":"数字","title":"基于53位参与者问卷数据的互动可视化。","p5":"确认使用 p5.js","evidence":"第12周成品嵌入 p5.js Web Editor（Final）。"},{"id":25,"repo":"nrid934/DES240-Making-Journal-Nahlah-Ridwan","url":"https://nrid934.github.io/DES240-Making-Journal-Nahlah-Ridwan/","type":"实体","title":"奥克兰流浪猫数据的实体地图作品。","p5":"不适用","evidence":"第12周标题标注 Final Physical Project。"},{"id":26,"repo":"yhan337-alt/Making-journal","url":"https://yhan337-alt.github.io/Making-journal/","type":"实体","title":"黑箱互动装置，以匿名回应和弹珠积累呈现课堂中的沉默经验。","p5":"不适用","evidence":"第12周项目陈述描述实体材料、黑箱与弹珠档案。"},{"id":27,"repo":"WeirdoJimbo/Making-Journal---Jimmy","url":"https://weirdojimbo.github.io/Making-Journal---Jimmy/","type":"实体","title":"Hesperides：激光切割木材与3D打印苹果组成的消费数据作品。","p5":"不适用","evidence":"第12周明确描述实体数据可视化。"},{"id":28,"repo":"sset540/Making-Journal-Final","url":"https://sset540.github.io/Making-Journal-Final/","type":"数字","title":"Spotify 情绪数据肖像；未见明确最终成品，参考性较低。","p5":"未确认","evidence":"第5周提案提过 p5.js；最后记录只提浏览器 sketch，未见明确最终成品，也未确认框架，参考性较低。"},{"id":29,"repo":"Soraph10/Making-Journal","url":"https://soraph10.github.io/Making-Journal/","type":"只记录到第六周","title":"目前可见日志只到第六周，缺少最终成果记录。","p5":"未确认","evidence":"按用户标注，日志只写到第六周。"}];
const typeOrder=['数字','实体','混合','只记录到第四周','只记录到第五周','只记录到第六周','模板原件'];
const typeClass={'数字':'digital','实体':'physical','混合':'mixed','只记录到第四周':'week','只记录到第五周':'week','只记录到第六周':'week','模板原件':'template'};
const pClass={'确认使用 p5.js':'p5yes','确认未使用 p5.js':'na','确认其他工具':'p5other','未确认':'p5unknown','不适用':'na'};
let selectedType='数字';

function badge(s,cls){return `<span class="pill ${cls}">${s}</span>`}
function renderCards(){const count=t=>rows.filter(x=>t==='记录不完整'?/^只记录到/.test(x.type):x.type===t).length;const vals=[['实体','实体项目','实体作品'],['混合','混合项目','跨媒介作品'],['记录不完整','记录不完整','按最后可见周次标记']];const digital=`<div class="digital-stack"><button class="card accent category-card ${selectedType==='数字'?'active':''}" data-type="数字" aria-pressed="${selectedType==='数字'}"><span>数字项目</span><strong>${count('数字')}</strong><small>数字作品</small></button><div id="p5Filters" class="p5-filters" ${selectedType==='数字'?'':'hidden'}></div></div>`;document.querySelector('#cards').innerHTML=digital+vals.map(([key,label,note])=>`<button class="card accent category-card ${selectedType===key?'active':''}" data-type="${key}" aria-pressed="${selectedType===key}"><span>${label}</span><strong>${count(key)}</strong><small>${note}</small></button>`).join('');document.querySelectorAll('#cards .category-card').forEach(card=>card.addEventListener('click',()=>{selectedType=selectedType===card.dataset.type?'':card.dataset.type;selectedP5='';render()}))}

let sortKey='id', sortDir=1, selectedP5='';
function filtered(){return rows.filter(x=>{const typeMatch=!selectedType||(selectedType==='记录不完整'?/^只记录到/.test(x.type):x.type===selectedType);return typeMatch&&(!selectedP5||x.p5===selectedP5)}).sort((a,b)=>{let x=a[sortKey],y=b[sortKey];if(sortKey==='id')return(x-y)*sortDir;return String(x).localeCompare(String(y),'zh-CN')*sortDir})}
function render(){const data=filtered();renderCards();const p5Mode=selectedType==='数字';const filters=document.querySelector('#p5Filters');const showP5Column=p5Mode&&!selectedP5;document.querySelector('#p5Header').hidden=!showP5Column;if(p5Mode){const opts=[['','全部数字项目'],['确认使用 p5.js','确认使用 p5.js'],['确认其他工具','确认其他工具'],['未确认','未确认']];filters.innerHTML='<div class="p5-heading">p5.js 核对</div><div class="p5-options">'+opts.map(([value,label])=>{const n=rows.filter(x=>x.type==='数字'&&(!value||x.p5===value)).length;return `<button class="p5-option ${selectedP5===value?'active':''}" data-value="${value}" aria-pressed="${selectedP5===value}"><span>${label}</span><span class="p5-num">${n}</span></button>`}).join('')+'</div>';filters.querySelectorAll('.p5-option').forEach(btn=>btn.addEventListener('click',()=>{selectedP5=btn.dataset.value;render()}))}document.querySelector('#count').textContent=`显示 ${data.length} / ${rows.length} 条`;document.querySelector('#footCount').textContent=`${data.length} / ${rows.length}`;const body=document.querySelector('#body');body.innerHTML=data.map(x=>`<tr><td class="num">${x.id}</td><td class="repo"><a href="${x.url}" target="_blank" rel="noopener">${x.repo}</a><br><a class="url" href="${x.url}" target="_blank" rel="noopener">打开 GitHub Pages ↗</a></td><td class="project">${x.title}</td>${showP5Column?`<td class="status">${badge(x.p5,pClass[x.p5]||'na')}</td>`:''}</tr>`).join('');document.querySelector('#empty').hidden=data.length>0;document.querySelector('#totalCount').textContent=rows.length}

document.querySelectorAll('th[data-key]').forEach(th=>th.addEventListener('click',()=>{if(th.dataset.key==='p5'&&selectedType!=='数字')return;const key=th.dataset.key;sortDir=key===sortKey?-sortDir:1;sortKey=key;render()}));render();
</script></body></html>
